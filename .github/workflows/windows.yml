name: Windows installer and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Check release version and Inno Setup compiler
        shell: pwsh
        run: |
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match project version v$version."
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw 'The Windows 2022 runner must provide Inno Setup 6.3 or newer.'
          }
          $compilerVersion = (Get-Item $compiler).VersionInfo.FileVersion
          if ([version]$compilerVersion -lt [version]'6.3') { throw 'Inno Setup 6.3 or newer required.' }
          Write-Host "Studytonks $version; Inno Setup $compilerVersion."
      - name: Test, bundle Python and Qt, build and validate installer
        shell: cmd
        run: build.bat
      - name: Install, upgrade, open bundled app and uninstall preserving data
        shell: pwsh
        run: ./packaging/test_installer.ps1
      - name: Keep installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Studytonks-Installer-Diagnostics
          if-no-files-found: ignore
          path: dist/installer-test-*.log
      - name: Upload complete Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: Studytonks-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/release/Studytonks-Setup.exe
            dist/release/Studytonks-Portable.zip
            dist/release/Studytonks-Source.zip
            dist/release/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Studytonks-Windows
          path: release
      - name: Verify deliverables and publish GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          **Studytonks — Learn. Track. Master.**

          Windows 10/11 de 64 bits. Baixe **Studytonks-Setup.exe**, abra e siga o instalador. Python, Qt e todas as bibliotecas já estão incluídos; o aplicativo funciona offline.

          A alternativa **Studytonks-Portable.zip** permite extrair a pasta inteira e abrir `Studytonks/Studytonks.exe`. Não mova o executável separado de `_internal`.

          **Studytonks-Source.zip** contém o projeto completo do commit desta versão, com testes, documentação, site e ferramentas de compilação.

          Matérias, anotações e avaliações ficam em `%APPDATA%\Studytonks`, preservadas nas atualizações e na desinstalação. Exporte um backup pelas Configurações antes de atualizar.

          Inicialização com o Windows é opcional e solicita confirmação nas Configurações. Lembretes exigem que o aplicativo esteja aberto, inclusive na bandeja.

          Os binários ainda não têm assinatura Authenticode; o Windows pode exibir um aviso de editor desconhecido. `SHA256SUMS.txt` permite conferir os arquivos baixados.
          EOF
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Studytonks $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release edit "$RELEASE_TAG" --title "Studytonks $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" Studytonks-Setup.exe Studytonks-Portable.zip Studytonks-Source.zip SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

  website:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ github.ref_name }}
